<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- VT323 font (official source) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">


    <title>Snake Game</title>
    <link rel="stylesheet" href="style.css">

</head>

<body>

    <div id="gameContainer">

        <div id="hud">
            <div class="hud-left">SCORE <span id="scoreText">0</span></div>
            <div class="hud-right">HIGH <span id="highScoreText">0</span></div>
        </div>

        <div class="board-wrapper">
            <canvas id="gameBoard" width="500" height="500"></canvas>

            <div id="gameOverOverlay">
                <div class="gameover-text">GAME OVER</div>
            </div>

            <div id="pausedOverlay">
                <div class="paused-text">PAUSED</div>
            </div>
            
        </div>


        <div id="controls">

            <button id="pauseButton" class="icon-btn" title="Pause" aria-label="Pause">
                <img src="assets/icons/icon-pause.svg" alt="">
            </button>

            <button id="playButton" class="icon-btn" title="Play" aria-label="Play">
                <img src="assets/icons/icon-play.svg" alt="">
            </button>

            <button id="resetButton" class="icon-btn" title="Restart" aria-label="Restart">
                <img src="assets/icons/icon-restart.svg" alt="">
            </button>

        </div>

    </div>


    <script src="index.js"></script>

</body>


</html>
